name: training_logger
description: Climbing training logger — Android, iOS, Web.
publish_to: 'none'
version: 1.3.7+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database (SQLite, works on Android/iOS/Web)
  # Pinned to the version drift_dev 2.34.0 can verify schemas against: later
  # drift releases changed an API its verifier calls, and drift_dev 2.34.1+
  # needs analyzer 13 (meta 1.18), which this Flutter SDK pins lower. Lift
  # both together once the SDK moves up.
  drift: '>=2.18.0 <2.34.1'
  drift_flutter: ^0.3.0

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation (URL-based — important for web)
  go_router: ^17.2.0

  # Charts
  fl_chart: ^1.2.0

  # Calendar widget
  table_calendar: ^3.1.2

  # Date formatting
  intl: ^0.20.2

  # Image picking (gallery + camera, works on Android/iOS/Web)
  image_picker: ^1.1.0

  # File picking for CSV import
  file_picker: ^12.0.0
  share_plus: ^13.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8

  # External-URL launching for the Inspirations page
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  # Raw connection used by the migration test to write a pre-upgrade database.
  sqlite3: ^3.3.0

flutter:
  uses-material-design: true

dependency_overrides:
  # jni arrives transitively through path_provider_android and is only used on
  # Android, but its C sources are still compiled for the Linux desktop build,
  # where 1.0.1+ fails on incompatible pointer types with a current compiler.
  # Holding it at 1.0.0 keeps `flutter build linux` working.
  jni: 1.0.0
